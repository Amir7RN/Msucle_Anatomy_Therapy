<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Force HTTPS (the .health registry requires SSL/TLS on live sites). GitHub
         Pages issues a free certificate for a custom domain once "Enforce HTTPS"
         is enabled; this is a belt-and-suspenders redirect for any plain-http hit. -->
    <script>
      (function () {
        var h = location.hostname
        if (location.protocol === 'http:' && h !== 'localhost' && !/^127\./.test(h)) {
          location.replace('https://' + location.host + location.pathname + location.search + location.hash)
        }
      })()
    </script>
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <!-- Content-Security-Policy. GitHub Pages cannot send response headers, so
         this <meta> tag is the delivery mechanism (frame-ancestors / X-Frame-
         Options cannot be expressed in a meta CSP — those need an edge layer,
         see public/_headers). Every remote the app talks to is allow-listed:
         MediaPipe (jsdelivr + Google Storage), Google Fonts, Supabase (REST,
         realtime WS, edge functions), Anthropic (BYOK direct mode), and the
         metered.ca TURN relay for remote assessment calls. -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; base-uri 'self'; object-src 'none'; form-action 'self'; script-src 'self' 'unsafe-inline' 'wasm-unsafe-eval' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob:; media-src 'self' blob: data:; worker-src 'self' blob:; connect-src 'self' https://cdn.jsdelivr.net https://storage.googleapis.com https://api.anthropic.com https://*.supabase.co wss://*.supabase.co https://*.functions.supabase.co https://*.metered.live https://*.metered.ca blob: data:" />
    <link rel="icon" type="image/svg+xml" href="./zevahealth-icon.svg" />
    <meta name="theme-color" content="#f7f8fc" />
    <meta name="description" content="Zevahealth AI: pinpoint muscle pain on an interactive 3D anatomy model, get relief exercises matched to the exact muscle, and train with an AI form coach that checks your posture — free in your browser." />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://zeva.health/" />
    <title>Zevahealth AI — Muscle pain relief &amp; 3D anatomy diagnosis</title>

    <!-- Open Graph (Google, LinkedIn, Facebook, iMessage link previews) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Zevahealth AI" />
    <meta property="og:url" content="https://zeva.health/" />
    <meta property="og:title" content="Zevahealth AI — muscle pain relief starts with knowing the muscle" />
    <meta property="og:description" content="Pinpoint muscle pain on a 3D anatomy model, get relief exercises matched to the muscle, and train with an AI form coach — free in your browser." />
    <meta property="og:image" content="https://zeva.health/headerLogo.png" />

    <!-- Twitter / X card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Zevahealth AI — muscle pain relief starts with knowing the muscle" />
    <meta name="twitter:description" content="Pinpoint muscle pain on a 3D anatomy model, get relief exercises matched to the muscle, and train with an AI form coach — free in your browser." />
    <meta name="twitter:image" content="https://zeva.health/headerLogo.png" />

    <!-- Structured data — helps Google understand the site -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "Zevahealth AI",
        "url": "https://zeva.health/",
        "applicationCategory": "HealthApplication",
        "operatingSystem": "Web",
        "browserRequirements": "Requires JavaScript and a modern browser",
        "description": "Pinpoint muscle pain on an interactive 3D anatomy model, get relief exercises matched to the exact muscle, and train with an AI form coach.",
        "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" }
      }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap"
      rel="stylesheet"
    />
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body, #root { width: 100%; height: 100%; overflow: hidden; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <div style="max-width:640px;margin:48px auto;padding:0 20px;font-family:Inter,Arial,sans-serif;color:#0f172a;">
        <h1>Muscle pain relief starts with knowing the muscle</h1>
        <p>Zevahealth AI lets you pinpoint what hurts on an interactive 3D muscle anatomy model,
        get muscle pain relief exercises matched to the exact muscle, and work out with an AI
        coach that checks your form and posture — free in your browser.</p>
        <p>Please enable JavaScript to use the interactive app.</p>
      </div>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
