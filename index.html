        <h1>Zevahealth AI — find the muscle behind your pain</h1>
        <p><strong>Zevahealth AI</strong> (the MoveMate app) is a free, browser-based tool that helps

        no download; it runs in your browser on desktop or mobile.</p>

        <h2>Find the muscle causing your pain</h2>
        <p>Tap the sore spot on an interactive 3D body model and Zevahealth AI highlights the likely
        muscle contributors. Isolate each muscle to see its tension pattern, compare candidates, and
        confirm the real source of the pain. Prefer words? Just describe the pain in chat and the AI
        asks the right follow-up questions until the source is clear.</p>

        <h2>What Zevahealth AI does</h2>
        <ul>
          <li><strong>Interactive 3D muscle model:</strong> explore a full anatomy model and tap the exact spot that hurts.</li>
          <li><strong>Muscle pain finder:</strong> see the likely muscle contributors behind sore shoulders, backs, hips, knees, and more.</li>
          <li><strong>AI pain chat:</strong> type or speak your symptoms; the AI triages your pain to the most probable muscle source.</li>
          <li><strong>AI form coach:</strong> uses your camera and pose detection to track joint angles, count reps, score form, and give live cues while you exercise.</li>
          <li><strong>Targeted exercises:</strong> get suggested movements tuned to the specific muscle you identified.</li>
        </ul>
